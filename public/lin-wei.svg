<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff8f2"/>
      <stop offset="100%" stop-color="#fde6c8"/>
    </radialGradient>
    <radialGradient id="skin" cx="42%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#fee0bc"/>
      <stop offset="100%" stop-color="#f4b87c"/>
    </radialGradient>
    <radialGradient id="skin-ear" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f4b87c"/>
      <stop offset="100%" stop-color="#e09060"/>
    </radialGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f09898" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f09898" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hair-r" cx="38%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#2e1a18"/>
      <stop offset="100%" stop-color="#0a0505"/>
    </radialGradient>
    <clipPath id="scene">
      <circle cx="100" cy="100" r="95"/>
    </clipPath>
  </defs>

  <!-- Outer border ring -->
  <circle cx="100" cy="100" r="100" fill="#b02828"/>
  <circle cx="100" cy="100" r="97"  fill="#cc3030"/>
  <circle cx="100" cy="100" r="94"  fill="url(#bg)"/>
  <circle cx="100" cy="100" r="93"  fill="none" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="3 5"/>

  <g clip-path="url(#scene)">

    <!-- ── Clothes: qipao collar ── -->
    <ellipse cx="100" cy="188" rx="62" ry="32" fill="#8b1818"/>
    <ellipse cx="100" cy="174" rx="52" ry="26" fill="#c0392b"/>
    <!-- Gold collar trim -->
    <path d="M70,163 Q86,176 100,178 Q114,176 130,163" fill="none" stroke="#d4a017" stroke-width="2.2"/>
    <!-- Frog button -->
    <path d="M94,162 Q100,170 106,162" fill="none" stroke="#d4a017" stroke-width="2" stroke-linecap="round"/>
    <circle cx="100" cy="158" r="4" fill="#d4a017"/>
    <circle cx="100" cy="158" r="2.2" fill="#f5d76e"/>
    <!-- Gold dots on chest -->
    <circle cx="85" cy="172" r="2.2" fill="#d4a017" opacity="0.7"/>
    <circle cx="115" cy="172" r="2.2" fill="#d4a017" opacity="0.7"/>

    <!-- ── Neck ── -->
    <rect x="89" y="147" width="22" height="19" rx="9" fill="url(#skin)"/>

    <!-- ── Hair back ── -->
    <ellipse cx="100" cy="83" rx="49" ry="48" fill="url(#hair-r)"/>

    <!-- ── Head / face ── -->
    <ellipse cx="100" cy="97" rx="39" ry="45" fill="url(#skin)"/>

    <!-- ── Ears ── -->
    <ellipse cx="61" cy="99" rx="9" ry="11" fill="url(#skin-ear)"/>
    <ellipse cx="139" cy="99" rx="9" ry="11" fill="url(#skin-ear)"/>
    <ellipse cx="61" cy="99" rx="5" ry="7"  fill="#d98858"/>
    <ellipse cx="139" cy="99" rx="5" ry="7"  fill="#d98858"/>
    <!-- Gold drop earrings -->
    <circle cx="61" cy="105" r="3.5" fill="#d4a017"/>
    <circle cx="61" cy="105" r="2"   fill="#f5d76e"/>
    <circle cx="139" cy="105" r="3.5" fill="#d4a017"/>
    <circle cx="139" cy="105" r="2"   fill="#f5d76e"/>

    <!-- ── Hair front / bangs ── -->
    <path d="M51,93 Q56,52 100,47 Q144,52 149,93 Q132,63 100,60 Q68,63 51,93Z" fill="url(#hair-r)"/>

    <!-- ── Bun ── -->
    <ellipse cx="100" cy="47" rx="21" ry="15" fill="#0a0505"/>
    <ellipse cx="100" cy="47" rx="18" ry="12" fill="url(#hair-r)"/>
    <!-- Bun sheen -->
    <ellipse cx="94" cy="41" rx="8" ry="4.5" fill="#3a2018" opacity="0.45"/>

    <!-- ── Flower hairpin ── -->
    <!-- Pin stick -->
    <line x1="82" y1="37" x2="118" y2="57" stroke="#b08010" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Petal ring -->
    <circle cx="79" cy="32" r="5.5" fill="#e84040" opacity="0.92"/>
    <circle cx="86" cy="27" r="5.5" fill="#ff6060" opacity="0.92"/>
    <circle cx="93" cy="29" r="5.5" fill="#e84040" opacity="0.92"/>
    <circle cx="94" cy="37" r="5.5" fill="#ff6060" opacity="0.92"/>
    <circle cx="87" cy="40" r="5.5" fill="#e84040" opacity="0.92"/>
    <!-- Flower centre -->
    <circle cx="87" cy="33" r="5"   fill="#f5d76e"/>
    <circle cx="87" cy="33" r="3"   fill="#d4a017"/>
    <circle cx="87" cy="33" r="1.5" fill="#f5d76e"/>

    <!-- ── Side hair wisps ── -->
    <path d="M51,90 Q49,103 52,116" stroke="#0a0505" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M149,90 Q151,103 148,116" stroke="#0a0505" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- ── Eyebrows (sit just above glasses) ── -->
    <path d="M74,76 Q83,71 92,74" stroke="#2c1208" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M108,74 Q117,71 126,76" stroke="#2c1208" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- ── LEFT EYE ── -->
    <ellipse cx="84" cy="91" rx="11.5" ry="9" fill="white"/>
    <!-- Upper lid shadow tint -->
    <path d="M72.5,91 Q84,82 95.5,91" fill="#c8a0b0" opacity="0.18"/>
    <!-- Iris -->
    <circle cx="84.5" cy="92" r="7"   fill="#2c1208"/>
    <circle cx="84.5" cy="92" r="4.5" fill="#0d0604"/>
    <!-- Shine -->
    <circle cx="87"   cy="89" r="2.4" fill="white"/>
    <circle cx="82.5" cy="94" r="1.1" fill="white" opacity="0.6"/>
    <!-- Lash line -->
    <path d="M72.5,89 Q84,81 95.5,89" fill="none" stroke="#2c1208" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Tiny outer lashes -->
    <line x1="73"  y1="89" x2="70"  y2="85.5" stroke="#2c1208" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="95"  y1="89" x2="97.5" y2="85.5" stroke="#2c1208" stroke-width="1.2" stroke-linecap="round"/>

    <!-- ── RIGHT EYE ── -->
    <ellipse cx="116" cy="91" rx="11.5" ry="9" fill="white"/>
    <path d="M104.5,91 Q116,82 127.5,91" fill="#c8a0b0" opacity="0.18"/>
    <circle cx="115.5" cy="92" r="7"   fill="#2c1208"/>
    <circle cx="115.5" cy="92" r="4.5" fill="#0d0604"/>
    <circle cx="118"   cy="89" r="2.4" fill="white"/>
    <circle cx="113.5" cy="94" r="1.1" fill="white" opacity="0.6"/>
    <path d="M104.5,89 Q116,81 127.5,89" fill="none" stroke="#2c1208" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="105"  y1="89" x2="102.5" y2="85.5" stroke="#2c1208" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="127"  y1="89" x2="129.5" y2="85.5" stroke="#2c1208" stroke-width="1.2" stroke-linecap="round"/>

    <!-- ── GLASSES (oval, gold frames) ── -->
    <ellipse cx="84"  cy="91" rx="15" ry="12" fill="none" stroke="#c8a030" stroke-width="2.2"/>
    <ellipse cx="116" cy="91" rx="15" ry="12" fill="none" stroke="#c8a030" stroke-width="2.2"/>
    <!-- Nose bridge -->
    <path d="M99,91 Q100,89 101,91" fill="none" stroke="#c8a030" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Temple arms -->
    <path d="M69,91 Q62,93 57,97" fill="none" stroke="#c8a030" stroke-width="2"   stroke-linecap="round"/>
    <path d="M131,91 Q138,93 143,97" fill="none" stroke="#c8a030" stroke-width="2" stroke-linecap="round"/>

    <!-- ── Nose ── -->
    <path d="M97,109 Q100,114 103,109" stroke="#d48860" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- ── Cheek blush ── -->
    <ellipse cx="68"  cy="108" rx="14" ry="9" fill="url(#cheek)"/>
    <ellipse cx="132" cy="108" rx="14" ry="9" fill="url(#cheek)"/>

    <!-- ── Warm smile ── -->
    <path d="M85,120 Q100,133 115,120" stroke="#c06858" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Lip fill -->
    <path d="M87,120 Q100,131 113,120 Q100,129 87,120Z" fill="#d47868" opacity="0.45"/>

  </g>

  <!-- 师 teacher badge (top-right) -->
  <circle cx="157" cy="43" r="16" fill="#8b1818"/>
  <circle cx="157" cy="43" r="14" fill="#c0392b"/>
  <circle cx="157" cy="43" r="13" fill="none" stroke="#d4a017" stroke-width="1.5"/>
  <text x="157" y="48.5" text-anchor="middle" font-family="serif" font-size="15" fill="#f5d76e" font-weight="bold">师</text>

  <!-- Final outer glow ring -->
  <circle cx="100" cy="100" r="99" fill="none" stroke="#d4a017" stroke-width="0.8" opacity="0.5"/>
</svg>
